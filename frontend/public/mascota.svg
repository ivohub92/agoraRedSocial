<!-- KIRA-BOT, mascota oficial de AnimeVerse -->
<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo Neón Cyberpunk Circular -->
    <circle cx="100" cy="100" r="90" fill="#0d0f18" stroke="#00f0ff" stroke-width="3" stroke-dasharray="8 4"/>
    <circle cx="100" cy="100" r="80" fill="#16192b" stroke="#ff2a85" stroke-width="2"/>
    
    <!-- Orejas de Robot/Gato Anime (Visor Superior) -->
    <path d="M50 70 L30 35 L70 55 Z" fill="#ff2a85" stroke="#ffffff" stroke-width="2"/>
    <path d="M150 70 L170 35 L130 55 Z" fill="#ff2a85" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Antenas Neón Lateral -->
    <circle cx="30" cy="35" r="5" fill="#00f0ff"/>
    <circle cx="170" cy="35" r="5" fill="#00f0ff"/>

    <!-- Cabeza Principal / Casco -->
    <rect x="45" y="55" width="110" height="90" rx="28" fill="#111322" stroke="#8b5cf6" stroke-width="3"/>

    <!-- Pantalla Visor de Ojos -->
    <rect x="55" y="70" width="90" height="50" rx="16" fill="#05070e" stroke="#00f0ff" stroke-width="2"/>

    <!-- Ojos Anime Digitales (Brillo Neón Cyberpunk) -->
    <!-- Ojo Izquierdo -->
    <ellipse cx="78" cy="95" rx="10" ry="14" fill="#ff2a85"/>
    <ellipse cx="78" cy="95" rx="5" ry="8" fill="#ffffff"/>
    <circle cx="81" cy="90" r="3" fill="#ffffff"/>
    
    <!-- Ojo Derecho (Expresión Guiño / Estrella) -->
    <path d="M 122 85 L 125 93 L 133 95 L 125 97 L 122 105 L 119 97 L 111 95 L 119 93 Z" fill="#00f0ff"/>

    <!-- Sonrisa Pixel/Cyber -->
    <path d="M90 128 Q100 135 110 128" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Mejillas Sonrojadas Anime -->
    <ellipse cx="65" cy="108" rx="6" ry="3" fill="#ff2a85" opacity="0.6"/>
    <ellipse cx="135" cy="108" rx="6" ry="3" fill="#ff2a85" opacity="0.6"/>

    <!-- Detalle Chapa de Crítico AnimeVerse -->
    <rect x="85" y="152" width="30" height="12" rx="4" fill="#ff2a85"/>
    <text x="100" y="161" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">PRO</text>
</svg>
